<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Soulink</title>
    <!-- Add to Home Screen: opens full screen like an app, dark status bar, Soulink icon -->
    <meta name="theme-color" content="#7c5cfc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soulink" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <style id="expo-reset">
      html, body { height: 100%; background: #0a0a0f; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Opened from the Home Screen icon: the strip behind the time and battery gets the Soulink gradient.
         (In a normal Safari tab this strip is 0 px high, so nothing shows.) */
      #sl-statusbar { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px);
        background: linear-gradient(120deg, #7c5cfc 0%, #b08fff 55%, #ff6b9d 100%); z-index: 2147483647; pointer-events: none; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Soulink.</noscript>
    <div id="sl-statusbar"></div>
    <div id="root"></div>
  </body>
</html>
