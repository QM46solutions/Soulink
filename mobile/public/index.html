<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Soulink</title>
    <!-- Add to Home Screen: opens full screen like an app, dark status bar, Soulink icon -->
    <meta name="theme-color" content="#7c5cfc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soulink" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #08070d; overscroll-behavior: none; }
      body { overflow: hidden; }
      /* Fill the WHOLE screen like a real app (Instagram): from the very top (behind the time and battery)
         to the very bottom (behind the home bar). iPhone Home Screen apps otherwise come out one status-bar
         height short, which left a gap under the bottom bar. */
      #root { display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
      /* Home Screen app on iPhone: the page is laid out one status-bar height shorter than the screen
         (that left the dark strip under the bottom bar), so stretch the app by exactly that much. */
      @media all and (display-mode: standalone) {
        #root { bottom: auto; height: calc(100% + env(safe-area-inset-top, 0px)); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Soulink.</noscript>
    <div id="root"></div>
    <script>
      // iPhone: (1) Home Screen app covers the whole screen, edge to edge.
      // (2) When the keyboard opens, the app shrinks to exactly the space above it, so the message box
      //     rises with the keyboard (like WhatsApp) instead of being hidden behind it.
      (function () {
        if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) return;
        var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        var vv = window.visualViewport;
        var raf = 0;
        function apply() {
          raf = 0;
          var r = document.getElementById('root');
          if (!r) return;
          var full = standalone ? Math.max(window.innerHeight, Math.round(screen.height)) : window.innerHeight;
          var keyboard = !!vv && (full - vv.height) > 150;
          if (keyboard) {
            // iOS slides the whole page up to show the text box; undo that and fit the app above the keyboard
            if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) {
              window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
            }
            r.style.top = Math.max(0, Math.round(vv.offsetTop)) + 'px';
            r.style.height = Math.round(vv.height) + 'px';
          } else {
            r.style.top = '0px';
            r.style.height = full + 'px';
          }
          r.style.bottom = 'auto';
          document.documentElement.classList.toggle('sl-keyboard', keyboard);
        }
        function fit() { if (!raf) raf = requestAnimationFrame(apply); }
        apply();
        window.addEventListener('resize', fit);
        window.addEventListener('scroll', fit, { passive: true });
        if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
        window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
        document.addEventListener('focusin', function () { setTimeout(fit, 50); setTimeout(fit, 350); setTimeout(fit, 700); });
        document.addEventListener('focusout', function () { setTimeout(fit, 120); setTimeout(fit, 500); });
      })();
    </script>
  </body>
</html>
