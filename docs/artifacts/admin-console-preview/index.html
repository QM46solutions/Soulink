<style>

:root{

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;margin:0}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}

:root[data-theme="dark"] .rail{background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:#fff;font-family:var(--display);font-weight:700;font-size:18px}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--railDim);letter-spacing:.08em}
.nav-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--railDim);padding:14px 10px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--railFg);text-decoration:none;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(155,123,255,.22);color:#fff}
.nav a .ct{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(240,100,120,.25);color:#ffc1cb;border-radius:20px;padding:1px 7px}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.who{margin-top:auto;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);color:var(--railFg);font-size:12.5px}
.who b{display:block;color:#fff;font-size:13.5px}

.who select option{color:#000}
main{min-width:0;padding-block:22px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top .sub{color:var(--mute);font-size:13px}
.top .sp{flex:1}
.sample{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--warn);background:var(--warnSoft);border-radius:6px;padding:4px 8px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.nav a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c21{grid-template-columns:2fr 1fr}.c12{grid-template-columns:1fr 2fr}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.panel h3{font-family:var(--display);font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel h3 .r{margin-left:auto;font-family:var(--body);font-weight:400;font-size:12px;color:var(--dim)}
.kpi .l{font-size:12px;color:var(--mute)}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-family:var(--mono)}
.up{color:var(--good)}.dn{color:var(--bad)}.wa{color:var(--warn)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.p-good{background:var(--goodSoft);color:var(--good)}.p-warn{background:var(--warnSoft);color:var(--warn)}.p-bad{background:var(--badSoft);color:var(--bad)}.p-acc{background:var(--accentSoft);color:var(--accent)}.p-dim{background:var(--panel2);color:var(--mute)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.bars .row{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bars .t{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}.bars .t i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bars .v{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.filters select,.filters input,.form select,.form input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:140px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.alert:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.rel{position:relative;margin-bottom:16px}
.rel::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.rel ul{margin:8px 0 0;padding-left:18px;color:var(--mute);line-height:1.6}
.rel .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rel .ver{font-family:var(--display);font-weight:700;font-size:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.cust{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;flex:none}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.hours{display:grid;grid-template-columns:44px repeat(24,minmax(14px,1fr));gap:2px;font-size:10px;font-family:var(--mono);color:var(--dim)}
.hours .h{height:22px;border-radius:3px;background:var(--panel2);cursor:pointer}
.hours .h.on{background:var(--accent)}
.price{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.price.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:16px}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;max-width:360px}
.toast.on{opacity:1;transform:none}
svg text{fill:var(--dim);font-family:var(--mono);font-size:10px}
.muted{color:var(--mute)}.small{font-size:12px}
.mt{margin-top:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--dim);font-size:13px;padding:14px 0}
.menu-btn{display:none}
@media (max-width:1100px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.c21,.c12{grid-template-columns:1fr}}
@media (max-width:760px){

  .rail{position:fixed;inset:0 auto 0 0;width:250px;transform:translateX(-105%);transition:.25s;z-index:20;height:100%}
  .rail.open{transform:none}
  .menu-btn{display:inline-flex}
  .k3,.k2,.form{grid-template-columns:1fr}
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bars .row{grid-template-columns:90px 1fr 54px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- tiny chart helpers ---------- */
function line(series,{w=640,h=180,cols=['var(--accent)','var(--accent2)'],labels=[]}={}){
  const all=series.flat();const mx=Math.max(...all)*1.08,mn=Math.min(...all)*.9;const n=series[0].length;
  const X=i=>34+i*(w-44)/(n-1),Y=v=>h-22-(v-mn)/(mx-mn)*(h-34);
  let g='';for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3;g+=`<line x1="34" x2="${w-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="30" y="${Y(v)+3}" text-anchor="end">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`}
  const paths=series.map((s,j)=>{const p=s.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');return (j==0?`<polygon points="${X(0)},${h-22} ${p} ${X(n-1)},${h-22}" fill="${cols[j]}" opacity=".10"/>`:'')+`<polyline points="${p}" fill="none" stroke="${cols[j]}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${X(n-1)}" cy="${Y(s[n-1])}" r="4" fill="${cols[j]}"/>`}).join('');
  const xl=labels.map(([i,t])=>`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}${paths}${xl}</svg>`}
function bars(rows,max,col){max=max||Math.max(...rows.map(r=>r[1]));return `<div class="bars">${rows.map(([l,v,c])=>`<div class="row"><span>${l}</span><div class="t"><i style="width:${v/max*100}%;${col||c?`background:${c||col}`:''}"></i></div><span class="v">${typeof v=='number'?fmt(v):v}</span></div>`).join('')}</div>`}
function donut(parts,size=130){const tot=parts.reduce((a,p)=>a+p[1],0);let a=0;const r=46,C=2*Math.PI*r;
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" role="img"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="16"/>${parts.map(([l,v,c])=>{const len=v/tot*C;const s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-a}" transform="rotate(-90 60 60)"/>`;a+=len;return s}).join('')}<text x="60" y="58" text-anchor="middle" style="font-size:15px;font-family:var(--display);font-weight:700;fill:var(--fg)">${fmt(tot)}</text><text x="60" y="73" text-anchor="middle">users</text></svg>`}
const kpi=(l,v,d,cls='up')=>`<div class="panel kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d ${cls}">${d}</div></div>`;

V.book=()=>{const b=st.bk;const c=CUSTOMERS.find(x=>x.id==b.cust);
 const hoursPerDay=b.hrs.length;const total=hoursPerDay*b.days;const base=RATE[b.pl];const mult=b.cities.reduce((s,ci)=>s+CITY_MULT[ci],0);const peak=b.hrs.filter(h=>h>=19&&h<=22).length*b.days;
 const sub=Math.round(total*base*mult+peak*base*mult*.25);const gst=Math.round(sub*.18);
 let grid='<div></div>'+Array.from({length:24},(_,h)=>`<div style="text-align:center">${h%3==0?h:''}</div>`).join('')+'<div>Hours</div>'+Array.from({length:24},(_,h)=>`<div class="h ${b.hrs.includes(h)?'on':''}" data-hr="${h}" title="${h}:00–${h+1}:00${h>=19&&h<=22?' · peak':''}" style="${h>=19&&h<=22&&!b.hrs.includes(h)?'outline:1px dashed var(--accent2);outline-offset:-1px':''}"></div>`).join('');
 return `<div class="grid c21"><div class="panel"><div class="form">
 <label for="bCust">Customer<select id="bCust">${CUSTOMERS.map(x=>`<option value="${x.id}" ${x.id==b.cust?'selected':''}>${x.n}</option>`).join('')}</select></label>
 <label for="bName">Ad name<input id="bName" value="${b.name}"></label>
 <label style="grid-column:1/-1">Placement<div class="chips">${Object.keys(RATE).map(p=>`<button class="chip ${p==b.pl?'on':''}" data-pl="${p}">${p=='Feed'?'Between posts':p=='Story'?'In stories':'Between Sparks'} · ${rs(RATE[p])}/h</button>`).join('')}</div></label>
 <label style="grid-column:1/-1">Cities<div class="chips">${Object.keys(CITY_MULT).map(ci=>`<button class="chip ${b.cities.includes(ci)?'on':''}" data-city="${ci}">${ci}${CITY_MULT[ci]!=1?` ×${CITY_MULT[ci]}`:''}</button>`).join('')}</div></label>
 <label for="bStart">Start date<input id="bStart" type="date" value="${b.start}"></label>
 <label for="bDays">Number of days<input id="bDays" type="number" min="1" max="60" value="${b.days}"></label>
 <label style="grid-column:1/-1">Hours each day<span class="small">Tap hours to select. Dashed = peak (7–11 pm, +25%).</span>
  <div class="tw"><div class="hours" style="min-width:560px">${grid}</div></div>
  <div class="chips"><button class="chip" data-preset="all">Full 24 hours</button><button class="chip" data-preset="eve">Evening 7–11 pm</button><button class="chip" data-preset="morn">Morning 6–9 am</button><button class="chip" data-preset="none">Clear</button></div></label>
 <label style="grid-column:1/-1">Ad content<div class="chips"><button class="chip on">Image</button><button class="chip">Video (up to 30 s)</button></div><span class="small">Button: <b>Reach out</b> (sends us the viewer's name and phone, only if they agree) or a website link.</span></label>
 </div></div>
 <div class="panel"><h3>Price</h3>
  <div class="price"><span>${hoursPerDay} h/day × ${b.days} days</span><b>${total} hours</b></div>
  <div class="price"><span>Rate (${b.pl})</span><b>${rs(base)} / hour</b></div>
  <div class="price"><span>Cities (${b.cities.join(', ')||'none'})</span><b>× ${mult.toFixed(1)}</b></div>
  <div class="price"><span>Peak hours (${peak} h)</span><b>+25%</b></div>
  <div class="price"><span>Subtotal</span><b>${rs(sub)}</b></div><div class="price"><span>GST 18%</span><b>${rs(gst)}</b></div>
  <div class="price tot"><span>Total</span><span>${rs(sub+gst)}</span></div>
  <div class="small muted mt">Estimated reach: about <b>${fmt(Math.round(total*mult*640))}</b> views from <b>${fmt(Math.round(Math.min(12480,total*mult*240)))}</b> people. Not guaranteed; based on users online in these hours.</div>
  <div class="small mt">Slots: <span class="pill p-good">${3-((b.hrs.includes(20))?1:0)} of 3 free at 8 pm</span></div>
  <button class="btn pri mt" style="width:100%;justify-content:center" ${total&&b.cities.length?'':'disabled'} id="confirmBk">Create booking & invoice</button>
  <div class="small muted mt">The ad goes live only after payment is recorded.</div></div></div>`};

const st={bk:{cust:'c1',name:'Diwali sale',pl:'Feed',cities:['Hyderabad'],start:'2026-11-21',days:3,hrs:[19,20,21,22]}};
function allowed(id){const p=PAGES.find(x=>x.id==id);return p&&p.roles.includes(role)}
function nav(){let g='',h='';PAGES.filter(p=>p.roles.includes(role)).forEach(p=>{if(p.g!=g){g=p.g;h+=`<div class="nav-h">${g}</div>`}h+=`<a href="#${p.id}" data-id="${p.id}"><svg viewBox="0 0 24 24">${ic[p.i]}</svg>${p.t}${p.ct?`<span class="ct">${p.ct}</span>`:''}</a>`});$('#nav').innerHTML=h;
 $('#whoName').textContent=ROLES[role].name;$('#whoRole').textContent=ROLES[role].role}
function render(){let id=(location.hash||'').slice(1);if(!allowed(id))id=PAGES.find(p=>p.roles.includes(role)).id;const p=PAGES.find(x=>x.id==id);
 document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.id==id));$('#title').textContent=p.t;$('#sub').textContent=p.s;$('#view').innerHTML=V[id]();$('#rail').classList.remove('open')}
nav();render();
addEventListener('hashchange',()=>{st.cust=null;render()});
$('#roleSel').addEventListener('change',e=>{role=e.target.value;try{localStorage.setItem('sl_role',role)}catch(x){}nav();render()});
$('#menuBtn').addEventListener('click',()=>$('#rail').classList.toggle('open'));
document.addEventListener('click',e=>{const t=e.target.closest('[data-toast],[data-cust],[data-back],[data-ctab],[data-issuef],[data-go],[data-pl],[data-city],[data-hr],[data-preset],[data-flag],#confirmBk,#exportUsers,#addRel');if(!t)return;
 if(t.dataset.toast){toast(t.dataset.toast);return}
 if(t.dataset.cust){st.cust=t.dataset.cust;st.ctab='ads';render();return}
 if(t.hasAttribute('data-back')){st.cust=null;render();return}
 if(t.dataset.ctab){st.ctab=t.dataset.ctab;render();return}
 if(t.dataset.issuef){st.issueF=t.dataset.issuef;render();return}
 if(t.dataset.go){location.hash=t.dataset.go;return}
 const b=st.bk;
 if(t.dataset.pl){b.pl=t.dataset.pl;render();return}
 if(t.dataset.city){const c=t.dataset.city;b.cities=b.cities.includes(c)?b.cities.filter(x=>x!=c):[...b.cities,c];render();return}
 if(t.dataset.hr){const h=+t.dataset.hr;b.hrs=b.hrs.includes(h)?b.hrs.filter(x=>x!=h):[...b.hrs,h];render();return}
 if(t.dataset.preset){b.hrs={all:[...Array(24).keys()],eve:[19,20,21,22],morn:[6,7,8],none:[]}[t.dataset.preset];render();return}
 if(t.hasAttribute('data-flag')){const on=t.classList.toggle('on');t.textContent=on?'On':'Off';toast(on?'Feature turned on for everyone (preview only).':'Feature turned off for everyone (preview only).');return}
 if(t.id=='confirmBk'){toast('Booking created and invoice raised (preview only). The ad goes live once payment is recorded.');return}
 if(t.id=='exportUsers'){toast('Downloads the filtered user counts as Excel (counts only, no personal details).');return}
 if(t.id=='addRel'){toast('Opens a form: version, store or over-the-air, date, new features and fixes. Filled automatically from each build where possible.');return}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='fCity'){st.city=t.value;st.area=null;render()} if(t.id=='fArea'){st.area=t.value;render()} if(t.id=='fG'){st.g=t.value;render()} if(t.id=='fA'){st.age=t.value;render()}
 if(t.id=='bCust'){st.bk.cust=t.value} if(t.id=='bName'){st.bk.name=t.value} if(t.id=='bStart'){st.bk.start=t.value} if(t.id=='bDays'){st.bk.days=Math.max(1,Math.min(60,+t.value||1));render()}});
