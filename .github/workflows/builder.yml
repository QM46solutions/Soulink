# Builds the Soulink video builder image (builder/Dockerfile), runs its end-to-end test inside the image, and publishes
# it to GitHub's container registry as ghcr.io/<owner>/soulink-builder. Azure Container Apps runs that image.
# Runs when builder/ changes, or by hand (Actions tab > Video builder image > Run workflow).
name: Video builder image
on:
  push:
    branches: [main]
    paths:
      - builder/**
      - .github/workflows/builder.yml
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency:
  group: builder
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soulink-builder" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -f builder/Dockerfile -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
      - name: Test a real build inside the image (1 CPU, 2 GB, like on Azure)
        run: |
          docker run --rm --cpus 1 --memory 2g --network host -e BUILDER_TOKEN=ci-test -v "$PWD/builder:/app/test:ro" -w /app \
            --entrypoint node "$IMAGE:latest" test/smoke_test.js
      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
