# Not needed since the move to Render's paid Standard plan (21 Nov 2026): paid servers never sleep.
# Kept as a manual check only (Actions › Keep Soulink awake › Run workflow) in case the server is ever on Free again.
name: Keep Soulink awake
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://soulink-xvbd.onrender.com/api/health || true
