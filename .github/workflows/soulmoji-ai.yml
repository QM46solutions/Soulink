# Builds the Soulmoji AI image (soulmoji-cloud/Dockerfile), checks it makes all 12 moods, and publishes it to
# GitHub's container registry as ghcr.io/<owner>/soulmoji-ai. Azure Container Apps runs that image.
# Runs when the AI files change, or by hand (Actions tab > Soulmoji AI image > Run workflow).
name: Soulmoji AI image
on:
  push:
    branches: [main]
    paths:
      - soulmoji-cloud/**
      - tools/soulmoji-ai/soulmoji_ai.py
      - .github/workflows/soulmoji-ai.yml
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency:
  group: soulmoji-ai
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soulmoji-ai" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -f soulmoji-cloud/Dockerfile -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
      - name: Check it makes all 12 moods (2 CPUs, 4 GB, like on Azure)
        run: |
          docker run -d --name ai --cpus 2 --memory 4g -e SOULMOJI_AI_TOKEN=ci-test -p 7860:7860 "$IMAGE:latest"
          pip install --quiet pillow
          python soulmoji-cloud/smoke_test.py http://127.0.0.1:7860 ci-test smoke-out || { docker logs ai; exit 1; }
          docker stats --no-stream ai
      - name: Keep the test pictures (download from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulmoji-ai-test
          path: smoke-out
      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
